<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3D presets review</title>
<!-- Phone-first review of 20 pre-rendered 3D presets x 5 drills. Nothing is
     live: every frame is a JPEG under content/presets/, rendered once on the
     Mac by tools/presets/capture.mjs. Links and images are RELATIVE, so the
     same file works on the vite dev server and under
     /tactivo-staging/engine3d/presets.html.

     Ratings and notes go to the SAME Supabase board the drill QA board uses,
     through review_board_save_v2 / review_board_load_v2 on board
     tactivo-drill-qa, one row per reviewer per preset
     (zz-preset-NN-carl / zz-preset-NN-billy) so two people can never
     overwrite each other. The passphrase doubles as the board token; it is
     never in this file. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;700;800&display=swap">
<script type="application/json" id="qa-config">{"url":"https://rfykucyuwoyrgvkwkwiy.supabase.co","key":"sb_publishable_YCYnAaWcK0lt_SxLFYBhHA_IdDXs7gi","board":"tactivo-drill-qa"}</script>
<style>
  :root {
    --bg: #0B0F10; --card: #171B1F; --line: #2A3036; --dim: #8D949B;
    --lime: #C8F323; --bad: #FF6B6B; --ok: #7FD18A;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: #fff; }
  body {
    font: 15px/1.45 Archivo, -apple-system, "Helvetica Neue", Arial, sans-serif;
    padding: 0 14px calc(96px + env(safe-area-inset-bottom));
    overscroll-behavior-y: contain;
  }
  h1 { font-size: 22px; line-height: 1.2; margin: 4px 0 6px; font-weight: 800; }
  p.desc { margin: 0 0 14px; color: #C7CDD2; font-size: 15px; }
  .count { color: var(--dim); font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
    margin: 14px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .count b { color: var(--lime); font-weight: 700; }
  .count a { color: var(--dim); text-decoration: none; border-bottom: 1px solid var(--line); }
  .frames { margin: 0 0 18px; }
  figure { margin: 0 0 14px; }
  figure img { width: 100%; display: block; border-radius: 12px; background: #000;
    border: 1px solid var(--line); }
  figcaption { color: var(--dim); font-size: 12px; padding: 6px 2px 0; display: flex;
    justify-content: space-between; gap: 8px; }
  figcaption b { color: #fff; font-weight: 600; }
  .who { border: 1px solid var(--line); border-radius: 14px; padding: 12px; margin: 0 0 12px;
    background: var(--card); }
  .who h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--dim); font-weight: 700; }
  .stars { display: flex; gap: 6px; margin: 0 0 10px; }
  .stars button { flex: 1; height: 52px; font-size: 24px; line-height: 1; border-radius: 10px;
    border: 1px solid var(--line); background: #0F1416; color: #3B4348; font-family: inherit; }
  .stars button.on { color: var(--lime); border-color: #4A5A15; background: #1A1F10; }
  textarea { width: 100%; min-height: 74px; border-radius: 10px; border: 1px solid var(--line);
    background: #0F1416; color: #fff; padding: 10px; font: inherit; font-size: 16px; resize: vertical; }
  .nav { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 10px;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 72%, rgba(11,15,16,0)); }
  .nav button { flex: 1; height: 56px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: #fff; font: 700 16px Archivo, sans-serif; }
  .nav button.go { background: var(--lime); color: #0B0F10; border-color: var(--lime); flex: 1.4; }
  .nav button:disabled { opacity: .35; }
  /* In the counter line, not floating over it: as a fixed chip in the top
     right it sat on top of the Summary link and ate the tap. */
  .save { font-size: 11px; color: var(--dim); margin-left: 8px; }
  .save[data-s="saved"] { color: var(--ok); }
  .save[data-s="local"], .save[data-s="retry"] { color: var(--bad); }
  .full { position: fixed; inset: 0; background: #000; z-index: 40; display: flex;
    align-items: center; justify-content: center; }
  .full img { max-width: 100%; max-height: 100%; }
  .full span { position: fixed; bottom: 18px; left: 0; right: 0; text-align: center;
    color: var(--dim); font-size: 12px; }
  /* summary */
  table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
  .sum { border-bottom: 1px solid var(--line); padding: 12px 0; }
  .sum h3 { margin: 0 0 2px; font-size: 16px; font-weight: 700; }
  .sum .avg { color: var(--lime); font-weight: 800; }
  .sum .col { color: var(--dim); font-size: 13px; margin-top: 6px; }
  .sum .col b { color: #fff; font-weight: 600; }
  .lock { min-height: 88vh; display: flex; align-items: center; justify-content: center; }
  .lockcard { width: 100%; max-width: 340px; text-align: center; }
  .lockcard input { width: 100%; height: 52px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: #fff; padding: 0 12px; font: inherit; font-size: 16px; margin: 10px 0; }
  .lockcard button { width: 100%; height: 52px; border-radius: 12px; border: 0;
    background: var(--lime); color: #0B0F10; font: 700 16px Archivo, sans-serif; }
  .lockcard em { display: block; font-style: normal; color: var(--bad); font-size: 13px; margin-top: 10px; }
  .lockcard p { color: var(--dim); }
</style>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  "use strict";

  /* ============ config ============ */
  var CFG = null;
  try { CFG = JSON.parse(document.getElementById("qa-config").textContent); } catch (e) { CFG = null; }
  var SUPA = (CFG && CFG.url && CFG.key && CFG.board) ? CFG : null;
  var PKEY = "tactivo-presets-pass";
  var LKEY = "tactivo-presets-state:" + location.pathname;
  var DKEY = "tactivo-presets-dirty:" + location.pathname;
  var REVIEWERS = ["Carl", "Billy"];
  var rowId = function (n, who) {
    return "zz-preset-" + (n < 10 ? "0" + n : String(n)) + "-" + who.toLowerCase();
  };

  var DATA = null;          // content/presets/index.json
  var passphrase = "";
  var state = { reviews: {} };   // rowId -> { rating, note, at }
  var dirty = {};
  var view = 0;             // 0..presets.length-1, then the summary
  var root = document.getElementById("root");

  try { state = JSON.parse(localStorage.getItem(LKEY)) || state; } catch (e) {}
  if (!state.reviews) state.reviews = {};
  try {
    JSON.parse(localStorage.getItem(DKEY) || "[]").forEach(function (id) { dirty[id] = true; });
  } catch (e) {}

  function saveLocal() {
    try { localStorage.setItem(LKEY, JSON.stringify(state)); } catch (e) {}
    try { localStorage.setItem(DKEY, JSON.stringify(Object.keys(dirty))); } catch (e) {}
  }
  function rec(n, who) {
    var id = rowId(n, who);
    if (!state.reviews[id]) state.reviews[id] = { rating: 0, note: "", at: 0 };
    return state.reviews[id];
  }

  /* ============ Supabase (copied from the QA board, minus the verdicts) ============ */
  var mode = SUPA ? "supabase" : "local";
  var saveTimer = null;

  function setSave(s) {
    var el = document.querySelector(".save");
    if (!el) return;
    el.dataset.s = s;
    el.textContent = s === "saving" ? "Saving…" : s === "saved" ? "Saved"
      : s === "retry" ? "Reconnecting…" : s === "local" ? "Kept on this phone" : "";
  }

  function rpc(fn, body) {
    return fetch(SUPA.url + "/rest/v1/rpc/" + fn, {
      method: "POST",
      headers: { "Content-Type": "application/json", apikey: SUPA.key,
        Authorization: "Bearer " + SUPA.key },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (r.ok) return r.status === 204 ? null : r.json();
      return r.text().then(function (t) {
        var err = new Error(r.status + " " + t); err.status = r.status; throw err;
      });
    });
  }

  // "rating: N\n<note>" is the whole payload; all four verdict columns stay null.
  function parseNote(text) {
    var m = /^rating:\s*(\d)\s*\n?([\s\S]*)$/.exec(text || "");
    return m ? { rating: Number(m[1]), note: m[2] } : { rating: 0, note: text || "" };
  }

  function pullRemote() {
    return rpc("review_board_load_v2", { p_board: SUPA.board, p_token: passphrase })
      .then(function (rows) {
        var changed = false;
        (rows || []).forEach(function (row) {
          if (!/^zz-preset-\d\d-(carl|billy)$/.test(row.template_id)) return;
          var at = Date.parse(row.updated_at) || 0;
          var mine = state.reviews[row.template_id];
          // A row this phone has not sent yet, and that is older than what is
          // here, must not clobber the local edit.
          if (mine && (dirty[row.template_id] || at <= (mine.at || 0))) return;
          var p = parseNote(row.note);
          state.reviews[row.template_id] = { rating: p.rating, note: p.note, at: at };
          changed = true;
        });
        if (changed) { saveLocal(); render(); }
      });
  }

  function saveOne(id) {
    var r = state.reviews[id];
    var who = /-carl$/.test(id) ? "Carl" : "Billy";
    return rpc("review_board_save_v2", {
      p_board: SUPA.board, p_token: passphrase, p_template_id: id,
      p_reviewer: who, p_text_ok: null, p_anim_ok: null, p_anim3d_ok: null,
      p_match_ok: null, p_note: "rating: " + (r.rating || 0) + "\n" + (r.note || "")
    });
  }

  function flush() {
    if (mode !== "supabase") { setSave("local"); return; }
    var ids = Object.keys(dirty);
    if (!ids.length) { setSave("saved"); return; }
    setSave("saving");
    Promise.all(ids.map(function (id) {
      delete dirty[id];
      return saveOne(id).catch(function (e) { dirty[id] = true; throw e; });
    })).then(function () {
      saveLocal();
      setSave(Object.keys(dirty).length ? "saving" : "saved");
    }).catch(function () {
      // Still in `dirty` and still on this phone; try again shortly.
      saveLocal();
      setSave("retry");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 5000);
    });
  }

  function queueSave(id) {
    dirty[id] = true;
    saveLocal();
    if (mode !== "supabase") { setSave("local"); return; }
    setSave("saving");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 1400);
  }

  /* ============ rendering ============ */
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function labelOf(key) {
    for (var i = 0; i < DATA.drills.length; i++) if (DATA.drills[i].key === key) return DATA.drills[i];
    return { key: key, label: key, note: "" };
  }

  function preload(i) {
    var p = DATA.presets[i];
    if (!p) return;
    DATA.drills.forEach(function (d) {
      var im = new Image();
      im.src = "content/presets/" + p.frames[d.key].file;
    });
  }

  function presetScreen(i) {
    var p = DATA.presets[i];
    var h = '<p class="count"><span><b>' + (i + 1) + "</b> of " + DATA.presets.length
      + '<span class="save"></span></span><a href="#summary" id="tosum">Summary</a></p>'
      + "<h1>" + esc(p.title) + "</h1>"
      + '<p class="desc">' + esc(p.desc) + "</p><div class=frames>";
    DATA.drills.forEach(function (d) {
      var f = p.frames[d.key];
      h += "<figure><img src=\"content/presets/" + f.file + '" alt="' + esc(d.label)
        + '" data-full="content/presets/' + f.file + '">'
        + "<figcaption><b>" + esc(d.label) + "</b><span>" + esc(d.note) + "</span></figcaption></figure>";
    });
    h += "</div>";
    REVIEWERS.forEach(function (who) {
      var r = rec(p.n, who);
      h += '<div class="who" data-who="' + who + '"><h2>' + who + "</h2><div class=stars>";
      for (var s = 1; s <= 5; s++) {
        h += '<button data-who="' + who + '" data-star="' + s + '" class="'
          + (r.rating >= s ? "on" : "") + '" aria-label="' + s + ' stars">★</button>';
      }
      h += "</div><textarea data-who=\"" + who + '" placeholder="What ' + who
        + ' thinks of this one…">' + esc(r.note) + "</textarea></div>";
    });
    h += '<div class="nav"><button id="prev"' + (i === 0 ? " disabled" : "") + ">Previous</button>"
      + '<button class="go" id="next">' + (i === DATA.presets.length - 1 ? "Summary" : "Next") + "</button></div>";
    root.innerHTML = h;
    scrollTo(0, 0);

    root.querySelectorAll(".stars button").forEach(function (b) {
      b.onclick = function () {
        var r = rec(p.n, b.dataset.who);
        var s = Number(b.dataset.star);
        r.rating = r.rating === s ? 0 : s;   // tapping the same star clears it
        r.at = Date.now();
        root.querySelectorAll('.stars button[data-who="' + b.dataset.who + '"]')
          .forEach(function (o) { o.classList.toggle("on", r.rating >= Number(o.dataset.star)); });
        queueSave(rowId(p.n, b.dataset.who));
      };
    });
    root.querySelectorAll("textarea").forEach(function (t) {
      t.oninput = function () {
        var r = rec(p.n, t.dataset.who);
        r.note = t.value; r.at = Date.now();
        queueSave(rowId(p.n, t.dataset.who));
      };
    });
    root.querySelectorAll("figure img").forEach(function (im) {
      im.onclick = function () { full(im.dataset.full, labelOf(im.alt)); };
    });
    document.getElementById("prev").onclick = function () { go(i - 1); };
    document.getElementById("next").onclick = function () { go(i + 1); };
    document.getElementById("tosum").onclick = function (e) { e.preventDefault(); go(DATA.presets.length); };
    setSave(mode === "supabase" ? (Object.keys(dirty).length ? "saving" : "saved") : "local");
    preload(i + 1); preload(i - 1);
  }

  function full(src, d) {
    var o = document.createElement("div");
    o.className = "full";
    o.innerHTML = '<img src="' + src + '"><span>' + esc(d.label) + " — tap to close</span>";
    o.onclick = function () { o.remove(); };
    document.body.appendChild(o);
  }

  function summaryRows() {
    return DATA.presets.map(function (p) {
      var c = rec(p.n, "Carl"), b = rec(p.n, "Billy");
      var have = [c.rating, b.rating].filter(function (x) { return x > 0; });
      var avg = have.length ? have.reduce(function (a, x) { return a + x; }, 0) / have.length : 0;
      return { p: p, carl: c, billy: b, avg: avg };
    }).sort(function (x, y) { return y.avg - x.avg || x.p.n - y.p.n; });
  }

  function summaryText() {
    return summaryRows().map(function (r) {
      return (r.avg ? r.avg.toFixed(1) : "-") + "  #" + r.p.n + " " + r.p.title
        + "\n    Carl: " + (r.carl.rating || "-") + "/5"
        + (r.carl.note ? " — " + r.carl.note.replace(/\n/g, " ") : "")
        + "\n    Billy: " + (r.billy.rating || "-") + "/5"
        + (r.billy.note ? " — " + r.billy.note.replace(/\n/g, " ") : "");
    }).join("\n");
  }

  function summaryScreen() {
    var h = '<p class="count"><span>Summary<span class="save"></span></span><span>best first</span></p>'
      + "<h1>What you both thought</h1>"
      + '<p class="desc">Ranked by the average of the two ratings, best first. Tap a row to go back to that preset.</p>';
    summaryRows().forEach(function (r) {
      h += '<div class="sum" data-n="' + r.p.n + '"><h3><span class="avg">'
        + (r.avg ? r.avg.toFixed(1) : "–") + "</span> · " + esc(r.p.title) + "</h3>"
        + '<div class="col"><b>Carl ' + (r.carl.rating || "–") + "/5</b> "
        + esc(r.carl.note || "") + "</div>"
        + '<div class="col"><b>Billy ' + (r.billy.rating || "–") + "/5</b> "
        + esc(r.billy.note || "") + "</div></div>";
    });
    h += '<div class="nav"><button id="prev">Back to 20</button>'
      + '<button class="go" id="copy">Copy all</button></div>';
    root.innerHTML = h;
    scrollTo(0, 0);
    root.querySelectorAll(".sum").forEach(function (el) {
      el.onclick = function () { go(Number(el.dataset.n) - 1); };
    });
    document.getElementById("prev").onclick = function () { go(DATA.presets.length - 1); };
    document.getElementById("copy").onclick = function () {
      var t = summaryText(), b = document.getElementById("copy");
      var done = function () { b.textContent = "Copied"; setTimeout(function () { b.textContent = "Copy all"; }, 1600); };
      if (navigator.clipboard) navigator.clipboard.writeText(t).then(done, function () { prompt("Copy this:", t); });
      else prompt("Copy this:", t);
    };
    setSave(mode === "supabase" ? (Object.keys(dirty).length ? "saving" : "saved") : "local");
  }

  function render() {
    if (view >= DATA.presets.length) summaryScreen(); else presetScreen(view);
  }
  function go(i) {
    view = Math.max(0, Math.min(DATA.presets.length, i));
    render();
  }

  // swipe left/right anywhere that is not the notes box
  var sx = 0, sy = 0;
  addEventListener("touchstart", function (e) {
    sx = e.touches[0].clientX; sy = e.touches[0].clientY;
  }, { passive: true });
  addEventListener("touchend", function (e) {
    if (!DATA || document.querySelector(".full")) return;
    if (e.target && e.target.tagName === "TEXTAREA") return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > 70 && Math.abs(dy) < 60) go(view + (dx < 0 ? 1 : -1));
  }, { passive: true });

  /* ============ boot ============ */
  function gate(msg) {
    root.innerHTML = '<div class="lock"><form class="lockcard" id="lockform">'
      + "<h1>3D presets review</h1>"
      + "<p>Same passphrase as the drill QA board.</p>"
      + '<input id="pass" type="password" autocomplete="current-password" placeholder="Passphrase" autofocus>'
      + "<button type=submit>Unlock</button><em>" + esc(msg || "") + "</em></form></div>";
    document.getElementById("lockform").onsubmit = function (ev) {
      ev.preventDefault();
      document.querySelector(".lockcard em").textContent = "Checking…";
      tryPass(document.getElementById("pass").value, true);
    };
  }

  function tryPass(pass, remember) {
    passphrase = pass;
    return pullRemote().then(function () {
      if (remember) { try { localStorage.setItem(PKEY, pass); } catch (e) {} }
      if (Object.keys(dirty).length) flush(); else render();
      // Two reviewers at once should see each other's marks turn up.
      setInterval(function () { if (!Object.keys(dirty).length) pullRemote().catch(function () {}); }, 20000);
    }).catch(function (err) {
      if (err && (err.status === 401 || err.status === 403)) {
        try { localStorage.removeItem(PKEY); } catch (e) {}
        gate("That passphrase does not open this board.");
        return;
      }
      // Offline or the board is unreachable: still reviewable, saved here.
      mode = "local";
      render();
    });
  }

  fetch("content/presets/index.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      DATA = d;
      if (!SUPA) { render(); setSave("local"); return; }
      var saved = null;
      try { saved = localStorage.getItem(PKEY); } catch (e) {}
      if (saved) tryPass(saved, false); else gate("");
    })
    .catch(function (e) {
      root.innerHTML = "<h1>3D presets review</h1><p class=desc>Could not load the presets ("
        + esc(e.message || e) + ").</p>";
    });
})();
</script>
</body>
</html>
